[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lightworker"
version = "0.2.0"
description = "A lightweight, local-first multi-agent task runner for Codex and OpenAI-compatible gateways."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "LightWorker contributors" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/ncepuee/LightWorker"
Repository = "https://github.com/ncepuee/LightWorker"
Issues = "https://github.com/ncepuee/LightWorker/issues"

[project.scripts]
lightworker = "lightworker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lightworker*"]

[tool.setuptools.package-data]
lightworker = [
  "schemas/*.json",
  "web/*.html",
  "web/*.css",
  "web/*.js",
  "web/*.svg",
  "web/*.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
