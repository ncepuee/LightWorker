[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lightworker"
version = "0.7.0"
description = "A lightweight, local-first multi-agent task runner for Codex and OpenAI-compatible gateways."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LightWorker contributors" }]
dependencies = []

[project.scripts]
lightworker = "lightworker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lightworker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
