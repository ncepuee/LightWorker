# Copy to %LOCALAPPDATA%\LightWorker\config.toml or use `lightworker init`.
[runner]
max_concurrency = 3
max_tasks_per_plan = 6
max_delegation_depth = 1
max_replans = 2
root_max_concurrency = 3
root_max_attempts = 8
root_max_retries = 1
root_max_escalations = 1
default_timeout_seconds = 1800
poll_interval_seconds = 0.25
# Cache Lab only groups exact cache cohorts; it never reads repository files
# to manufacture a prompt prefix. A Context Pack must be supplied explicitly.
cache_affinity_enabled = true
cache_affinity_window_seconds = 300
cache_warm_window_seconds = 3600
cache_target_hit_rate = 0.90
cache_min_warm_samples = 20
cache_config_scope = "lightworker.cache.default.v1"
cache_tool_contract = "codex.exec.v1"
allow_dirty_worktree_source = false
# Off by default: heuristic redaction cannot guarantee arbitrary secrets are removed.
retain_redacted_raw_results = false
codex_command = "codex"
codex_ignore_user_config = false
default_gateway = "opencodex"
# For an isolated CLIProxyAPI/OpenCodex worker, set true and configure both fields below.
# codex_ignore_user_config = true
# Default worker harness: codex or zcode
# worker_harness = "codex"
# zcode_command = "zcode"
# Windows paths must use single quotes (literal string) or escaped backslashes.
# zcode_cli_path = 'D:\ZCode\resources\glm\zcode.cjs'

# Allow worker sandbox network access (gh / git push) while keeping workspace-write file limits
codex_sandbox_network_access = false
# codex_base_url = "http://127.0.0.1:10100/v1"
# codex_model_catalog = "C:\\Users\\you\\.codex\\opencodex-catalog.json"

[gateways.opencodex]
base_url = "http://127.0.0.1:10100/v1"
response_mode = "native"
model_catalog = "C:\\Users\\you\\.codex\\opencodex-catalog.json"
# chat_to_responses is valid when OpenCodex has a tested openai-chat provider,
# such as workbuddy -> http://127.0.0.1:8787/v1.
capabilities = ["responses", "web_search", "codex_tools", "native_subagents", "chat_to_responses"]
enabled = true

[gateways.cliproxyapi]
base_url = "http://127.0.0.1:8317/v1"
response_mode = "translated"
api_key_env = "CLIPROXYAPI_CLIENT_KEY"
capabilities = ["translated_responses", "codex_tools"]
enabled = true

[model_routes."deepseek/deepseek-v4-flash"]
primary = "opencodex"
fallback = ["cliproxyapi"]
provider = "deepseek"

[model_routes."deepseek/deepseek-v4-flash".upstream_models]
opencodex = "deepseek/deepseek-v4-flash"
cliproxyapi = "deepseek-v4-flash"

# OpenCodex performs Responses -> openai-chat adaptation before calling the
# chat-only WorkBuddy Bridge. No WorkBuddy secret is stored in LightWorker.
[model_routes."workbuddy/hy3"]
primary = "opencodex"
fallback = []
provider = "workbuddy"
billing_class = "workbuddy-credit"
required_capabilities = ["chat_to_responses"]

[model_routes."workbuddy/hy3".upstream_models]
opencodex = "workbuddy/hy3"

[model_routes."workbuddy/auto"]
primary = "opencodex"
fallback = []
provider = "workbuddy"
billing_class = "workbuddy-credit"
required_capabilities = ["chat_to_responses"]

[model_routes."workbuddy/auto".upstream_models]
opencodex = "workbuddy/auto"

[model_routes."workbuddy/deepseek-v4-flash"]
primary = "opencodex"
fallback = []
provider = "workbuddy"
billing_class = "workbuddy-credit"
required_capabilities = ["chat_to_responses"]

