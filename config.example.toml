[models]
planner = "gpt-5.6-sol"
explore = "deepseek/deepseek-v4-flash"
execute = "gpt-5.6-luna"
review = "gpt-5.6-sol"
fast = "deepseek/deepseek-v4-flash"
reasoning = "gpt-5.6-sol"

# A task may request a profile instead of choosing a model directly. Explicit
# task-level model, gateway, and reasoning_effort values override these defaults.
[worker_profiles.planner]
description = "Break down ambiguous goals and make bounded routing decisions."
model = "gpt-5.6-sol"
reasoning_effort = "high"
allowed_kinds = ["plan"]

[worker_profiles.fast_worker]
description = "Perform narrow, repeatable, low-judgment exploration or mechanical work."
model = "deepseek/deepseek-v4-flash"
reasoning_effort = "low"
allowed_kinds = ["explore", "execute"]

# Executors are the highest-volume workers: a cost-efficient coding model with
# full reasoning budget keeps quality close to the reasoning model at lower cost.
[worker_profiles.executor]
description = "Write, modify, and refactor code to implement already-decided steps in an isolated worktree."
model = "gpt-5.6-luna"
reasoning_effort = "max"
allowed_kinds = ["execute"]

[worker_profiles.deep_worker]
description = "Handle bounded implementation or investigation that benefits from deeper reasoning."
model = "gpt-5.6-luna"
reasoning_effort = "max"
allowed_kinds = ["explore", "execute", "review"]

[worker_profiles.reviewer]
description = "Independently inspect evidence, tests, and implementation risks."
model = "gpt-5.6-terra"
reasoning_effort = "high"
allowed_kinds = ["review"]

[policy]
allowed_models = [
  "gpt-5.5",
  "gpt-5.6-luna",
  "gpt-5.6-sol",
  "gpt-5.6-terra",
  "deepseek/deepseek-v4-flash",
  "deepseek/deepseek-v4-pro",
  "google-antigravity/gemini-3.6-flash",
  "google-antigravity/claude-sonnet-4-6",
  "google-antigravity/claude-opus-4-6-thinking",
  "cursor/kimi-k2.7-code",
  "cursor/grok-4.5",
  "workbuddy/auto",
  "workbuddy/deepseek-v4-flash",
  "workbuddy/deepseek-v4-pro",
  "workbuddy/glm-5.1",
  "workbuddy/glm-5.2",
  "workbuddy/glm-5v-turbo",
  "workbuddy/kimi-k2.6",
  "workbuddy/kimi-k2.7",
  "workbuddy/kimi-k3-1",
  "workbuddy/minimax-m3",
  "workbuddy/hy3"
]
