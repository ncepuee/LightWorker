name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install pytest==8.4.2
      - name: Run pytest
        run: python -m pytest

  package:
    name: Build and verify package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install build tooling
        run: python -m pip install build==1.5.0 twine==6.2.0
      - name: Build wheel and sdist
        run: python -m build
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os
          import lightworker

          tag = os.environ["GITHUB_REF_NAME"]
          assert tag == f"v{lightworker.__version__}", (tag, lightworker.__version__)
          PY
      - name: Check distributions with twine
        run: twine check dist/*
      - name: Install wheel into a clean virtual environment
        run: |
          python -m venv .venv-wheeltest
          .venv-wheeltest/bin/python -m pip install dist/*.whl
      - name: Install sdist into a second clean virtual environment
        run: |
          python -m venv .venv-sdisttest
          .venv-sdisttest/bin/python -m pip install dist/*.tar.gz
      - name: Verify source-tree resources
        run: |
          set -euo pipefail
          test -f lightworker/web/index.html
          test -f lightworker/web/app.js
          test -f lightworker/web/styles.css
          test -f lightworker/web/logo.svg
          test -f lightworker/web/favicon.svg
          test -f lightworker/web/lightworker-app-icon.png
          test -f lightworker/schemas/plan.schema.json
          test -f lightworker/schemas/result.schema.json
      - name: Verify installed CLI and version metadata
        run: |
          set -euo pipefail
          # Since 0.8.0 the web console and schemas ship inside the wheel
          # (lightworker/web, lightworker/schemas); assert their presence
          # along with the CLI smoke and version metadata.
          .venv-wheeltest/bin/lightworker --help >/dev/null
          .venv-wheeltest/bin/python -I -m lightworker --help >/dev/null
          .venv-wheeltest/bin/python -I -c "import importlib.metadata as md, lightworker; assert lightworker.__version__ == md.version('lightworker')"
          .venv-wheeltest/bin/python -I -c "import lightworker, pathlib; root = pathlib.Path(lightworker.__file__).parent; assert (root / 'web' / 'index.html').is_file() and (root / 'schemas' / 'result.schema.json').is_file(), 'wheel must ship web console and schemas'"
          .venv-sdisttest/bin/lightworker --help >/dev/null
          .venv-sdisttest/bin/python -I -c "import importlib.metadata as md, lightworker; assert lightworker.__version__ == md.version('lightworker')"
      - name: Upload distributions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dist
          path: dist/
          if-no-files-found: error
