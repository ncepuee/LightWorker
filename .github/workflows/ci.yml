name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install pytest==8.4.2
      - name: Run pytest
        run: python -m pytest

  package:
    name: Build and verify package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install build tooling
        run: python -m pip install build==1.5.0 twine==6.2.0
      - name: Build wheel and sdist
        run: python -m build
      - name: Check distributions with twine
        run: twine check dist/*
      - name: Install wheel into a clean virtual environment
        run: |
          python -m venv .venv-wheeltest
          .venv-wheeltest/bin/python -m pip install dist/*.whl
      - name: Verify CLI and installed resources
        run: |
          set -euo pipefail
          .venv-wheeltest/bin/lightworker --help >/dev/null
          .venv-wheeltest/bin/python -m lightworker --help >/dev/null
          .venv-wheeltest/bin/python - <<'PY'
          import importlib.metadata as md
          from pathlib import Path
          import lightworker

          root = Path(lightworker.__file__).resolve().parent
          expected = [
              root / "web" / "index.html",
              root / "web" / "app.js",
              root / "web" / "styles.css",
              root / "web" / "logo.svg",
              root / "web" / "favicon.svg",
              root / "web" / "lightworker-app-icon.png",
              root / "schemas" / "plan.schema.json",
              root / "schemas" / "result.schema.json",
          ]
          missing = [str(path) for path in expected if not path.is_file()]
          assert not missing, f"missing installed resources: {missing}"
          assert lightworker.__version__ == md.version("lightworker")
          print("installed package resources verified")
          PY
      - name: Upload distributions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dist
          path: dist/
          if-no-files-found: error
